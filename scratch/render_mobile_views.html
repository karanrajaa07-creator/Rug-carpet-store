<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 20px; background: #222; display: flex; gap: 30px; justify-content: center; }
    .device { background: #fff; border-radius: 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.5); overflow: hidden; border: 8px solid #333; }
    .device-title { background: #333; color: #eee; font-family: sans-serif; font-size: 12px; text-align: center; padding: 4px 0; }
    iframe { border: none; display: block; }
  </style>
</head>
<body>
  <div class="device">
    <div class="device-title">360px Viewport (LTR Mode)</div>
    <iframe id="f_ltr" src="../index.html" style="width: 360px; height: 640px;"></iframe>
  </div>
  <div class="device">
    <div class="device-title">360px Viewport (RTL Active Mode)</div>
    <iframe id="f_rtl" src="../index.html" style="width: 360px; height: 640px;"></iframe>
  </div>

  <script>
    window.addEventListener('load', () => {
      const fRtl = document.getElementById('f_rtl');
      try {
        const doc = fRtl.contentDocument || fRtl.contentWindow.document;
        const btn = doc.querySelector('.header-action-btn[data-action="toggle-rtl"]');
        if (btn) btn.click();
      } catch(e) {}
    });
  </script>
</body>
</html>
