<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 20px; background: #222; display: flex; gap: 30px; justify-content: center; }
    .device { background: #fff; border-radius: 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.5); overflow: hidden; border: 8px solid #333; }
    .device-title { background: #333; color: #eee; font-family: sans-serif; font-size: 12px; text-align: center; padding: 6px 0; }
    iframe { border: none; display: block; }
  </style>
</head>
<body>
  <div class="device">
    <div class="device-title">360px Mobile Viewport</div>
    <iframe id="f_360" src="../products.html#productsGridContainer" style="width: 360px; height: 1100px;"></iframe>
  </div>
  <div class="device">
    <div class="device-title">390px iPhone Viewport</div>
    <iframe id="f_390" src="../products.html#productsGridContainer" style="width: 390px; height: 1100px;"></iframe>
  </div>

  <script>
    function scrollFrames() {
      ['f_360', 'f_390'].forEach(id => {
        try {
          const frame = document.getElementById(id);
          const win = frame.contentWindow;
          const doc = frame.contentDocument || win.document;
          const card1 = doc.getElementById('productCard-1') || doc.querySelector('.product-card');
          if (card1) {
            card1.scrollIntoView({ behavior: 'instant', block: 'start' });
          }
        } catch(e) {}
      });
    }
    window.addEventListener('load', () => {
      setTimeout(scrollFrames, 1200);
      setTimeout(scrollFrames, 2500);
    });
  </script>
</body>
</html>
