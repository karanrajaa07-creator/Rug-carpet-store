<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal Login — Atelier Rugs</title>
  <meta name="description" content="Access your bespoke rug commissions, tracked loom progress, saved wishlists, and concierge appointments.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="apple-touch-icon" href="assets/images/favicon.svg">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between">

  <!-- HEADER -->
  <header class="py-3 bg-surface border-bottom border-custom">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand-logo" href="index.html">
        <i class="bi bi-gem"></i>
        <span>ATELIER</span> RUGS
      </a>
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-sm btn-outline-secondary" data-action="toggle-rtl"><span class="rtl-toggle-text">RTL</span></button>
        <button class="btn btn-sm btn-outline-secondary" data-action="toggle-theme"><i class="bi bi-moon-stars theme-toggle-icon"></i></button>
      </div>
    </div>
  </header>

  <!-- AUTH SECTION -->
  <main class="py-5 flex-grow-1 d-flex align-items-center">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5 col-xl-4">
          <div class="luxury-card p-4 p-sm-5">
            <div class="text-center mb-4">
              <span class="badge badge-luxury-terracotta mb-2">Private Client Portal</span>
              <h2 class="font-serif fw-bold mb-1">Welcome Back</h2>
              <p class="small text-muted">Sign in to track bespoke commissions and saved rugs.</p>
            </div>

            <!-- Social Login -->
            <div class="d-grid gap-2 mb-3">
              <button class="btn btn-outline-secondary btn-sm d-flex align-items-center justify-content-center gap-2" onclick="showToast('Apple ID', 'Authenticating through Apple Private Relay...', 'bi-apple')">
                <i class="bi bi-apple fs-5"></i> Continue with Apple
              </button>
              <button class="btn btn-outline-secondary btn-sm d-flex align-items-center justify-content-center gap-2" onclick="showToast('Google ID', 'Authenticating through Google Secure Sign-in...', 'bi-google')">
                <i class="bi bi-google"></i> Continue with Google
              </button>
            </div>

            <div class="position-relative text-center my-4">
              <hr class="border-custom">
              <span class="position-absolute top-50 start-50 translate-middle px-3 bg-surface text-muted small">or with email</span>
            </div>

            <!-- Login Form -->
            <form onsubmit="handleLoginSubmit(event)" class="needs-validation" novalidate>
              <div class="mb-3">
                <label class="form-label" for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail" class="form-control" required placeholder="client@residence.com">
                <div class="invalid-feedback">Please enter a valid email address.</div>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label class="form-label mb-0" for="loginPassword">Password</label>
                  <a href="#" class="small text-terracotta text-decoration-none" onclick="showToast('Password Reset', 'Password recovery instructions dispatched to your email.', 'bi-key')">Forgot Password?</a>
                </div>
                <div class="input-group">
                  <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••">
                  <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('loginPassword', this.querySelector('i'))">
                    <i class="bi bi-eye"></i>
                  </button>
                  <div class="invalid-feedback">Password is required.</div>
                </div>
              </div>

              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                <label class="form-check-label small" for="rememberMe">Remember me for 30 days</label>
              </div>

              <button type="submit" class="btn btn-luxury-primary w-100 mb-3">Sign In to Atelier</button>

              <div class="text-center small text-muted">
                Do not have an account? <a href="register.html" class="text-terracotta fw-bold text-decoration-none">Create an Account</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="py-3 bg-surface border-top border-custom text-center small text-muted">
    © 2026 Atelier Rugs. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/validation.js"></script>
  <script>
    function handleLoginSubmit(event) {
      event.preventDefault();
      const form = event.target;
      if (!form.checkValidity()) {
        event.stopPropagation();
        form.classList.add('was-validated');
        return;
      }
      showToast('Welcome', 'Login verified. Redirecting to your customer dashboard...', 'bi-check2-circle');
      setTimeout(() => {
        window.location.href = 'admin/index.html';
      }, 1000);
    }
  </script>
</body>
</html>
