<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="rugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A231E"/>
      <stop offset="100%" stop-color="#181513"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2CAAA"/>
      <stop offset="100%" stop-color="#C5A880"/>
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D77F64"/>
      <stop offset="100%" stop-color="#B25C43"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="14" fill="url(#rugGrad)"/>
  
  <!-- Outer Rug Fringed Border -->
  <rect x="5" y="5" width="54" height="54" rx="10" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-dasharray="3, 1.5"/>
  <rect x="9" y="9" width="46" height="46" rx="7" fill="none" stroke="rgba(197, 168, 128, 0.4)" stroke-width="1"/>

  <!-- Symmetrical Persian Diamond Medallion -->
  <polygon points="32,13 49,32 32,51 15,32" fill="url(#terracottaGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <polygon points="32,20 42,32 32,44 22,32" fill="#231F1C" stroke="url(#goldGrad)" stroke-width="1"/>

  <!-- Core Radiant Starburst -->
  <circle cx="32" cy="32" r="5" fill="url(#goldGrad)"/>
  <circle cx="32" cy="32" r="2.2" fill="#FAF7F2"/>

  <!-- Corner Floral Knots -->
  <circle cx="17" cy="17" r="1.8" fill="url(#goldGrad)"/>
  <circle cx="47" cy="17" r="1.8" fill="url(#goldGrad)"/>
  <circle cx="17" cy="47" r="1.8" fill="url(#goldGrad)"/>
  <circle cx="47" cy="47" r="1.8" fill="url(#goldGrad)"/>
</svg>
